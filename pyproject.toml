[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "course-github-actions"
version = "0.1.0"
description = "A project to learn CI with GitHub Actions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
