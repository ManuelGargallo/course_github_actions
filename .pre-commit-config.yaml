repos:
  - repo: local
    hooks:
      - id: local-lint
        name: Run Linter & Formatter
        entry: make lint format
        language: system
        stages: [pre-commit]
        pass_filenames: false

      - id: local-typecheck
        name: Run Type Checking 
        entry: make typecheck
        language: system
        stages: [pre-commit]
        pass_filenames: false
      
      - id: local-pytest
        name: Run Local Test Suite
        entry: make test
        language: system
        stages: [pre-push]
        pass_filenames: false
